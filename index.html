<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://api.jsonbin.io" crossorigin>
<link rel="dns-prefetch" href="https://api.jsonbin.io">
<title>VESTRA — ستايلك. هويتك.</title>
<meta name="description" content="VESTRA: ملابس عصرية بتصميم مينيمال وجودة فاخرة. اكتشف المجموعة الجديدة.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;900&family=Syne:wght@600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--ink:#0a0a0a;--g1:#e6e6e3;--g2:#8a8a86;--ease:cubic-bezier(.16,1,.3,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:auto}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.7 'Alexandria',system-ui,sans-serif;overflow-x:hidden}
html[lang=en] body{font-family:'Syne','Alexandria',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px;box-shadow:0 0 0 5px #0a0a0a}
.dark :focus-visible,.dock :focus-visible{box-shadow:0 0 0 5px #fff;outline-color:#0a0a0a}
.wm{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:.18em;direction:ltr;display:inline-block}
.wrap{max-width:1280px;margin:auto;padding:0 clamp(18px,5vw,56px)}
/* dock */
.dock{position:fixed;top:0;left:50%;translate:-50% 0;z-index:50;background:#0a0a0a;color:#fff;border-radius:0 0 30px 30px;padding:env(safe-area-inset-top,0px) 14px 10px;display:flex;gap:2px;align-items:center;animation:drop 1s .9s var(--ease) both;max-width:calc(100vw - 16px)}
@keyframes drop{from{translate:-50% -110%}}
.dock a,.dock button{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:20px;font-size:13px;opacity:.6;transition:.35s var(--ease);position:relative;white-space:nowrap}
.dock a:hover,.dock button:hover,.dock .on{opacity:1;background:#ffffff1c}
.dock svg{width:18px;height:18px;flex:none}
.dock .logo{opacity:1;padding:8px 12px}.dock .logo svg{width:22px;height:22px}
.dock i{font-style:normal;position:absolute;top:2px;inset-inline-end:2px;background:#fff;color:#000;font:700 10px/16px Syne;min-width:16px;height:16px;border-radius:8px;text-align:center;transition:transform .4s var(--ease)}
.dock i.pop{transform:scale(1.5)}
@media(max-width:700px){.dock a span,.dock button span{display:none}.dock a,.dock button{padding:11px}}
/* hero */
.hero{min-height:100svh;position:relative;display:grid;align-items:end;padding:110px 0 40px;overflow:hidden;animation:bgin 1.2s both}
@keyframes bgin{from{opacity:0}}
.blob{position:absolute;border-radius:50%;background:#e9e9e6;filter:blur(2px);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;width:100%}
.hero h1{font-weight:900;font-size:clamp(46px,9vw,150px);line-height:1.08;letter-spacing:-.01em}
.ln{display:block;overflow:hidden;padding-block:.06em}.ln>span{display:block;transform:translateY(110%);transition:transform 1.1s var(--ease)}
.go .ln>span,.in .ln>span{transform:none}
.hero p{max-width:420px;color:#444;margin:20px 0 28px;opacity:0;transform:translateY(16px);transition:.9s 1.5s var(--ease)}
.go p,.go .cta{opacity:1!important;transform:none!important}
.btn{display:inline-flex;align-items:center;gap:12px;background:#0a0a0a;color:#fff;border-radius:40px;padding:15px 34px;font-weight:700;transition:transform .3s var(--ease),background .3s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px)}.btn:active{transform:scale(.96)}
.btn.w{background:#fff;color:#0a0a0a}
.cta{display:flex;gap:26px;align-items:center;flex-wrap:wrap;opacity:0;transform:translateY(20px);transition:.9s 1.7s var(--ease)}
.lk{position:relative;font-weight:700}.lk::after{content:"";position:absolute;inset:auto 0 -3px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.lk:hover::after{transform:scaleX(1)}
.visor{border-radius:200px 200px 28px 28px;background:#d9d9d6;aspect-ratio:3/4;max-height:78svh;margin-inline:auto;width:100%;overflow:hidden;clip-path:inset(100% 0 0 0 round 200px 200px 28px 28px);transition:clip-path 1.4s .5s var(--ease)}
.go .visor{clip-path:inset(0 0 0 0 round 200px 200px 28px 28px)}
.visor svg,.art svg{width:100%;height:100%;display:block}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}.visor{order:-1;max-height:46svh;aspect-ratio:4/4}}
/* sections */
section{position:relative}
.sec{padding:clamp(80px,12vw,180px) 0}
.big{font-weight:900;font-size:clamp(34px,6.5vw,104px);line-height:1.15}
.tag{font:700 12px Syne;letter-spacing:.2em;text-transform:uppercase;color:var(--g2);margin-bottom:18px;display:block}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
.in.rv,.rv.in{opacity:1;transform:none}
.w1{display:inline-block;overflow:hidden;vertical-align:top}.w1>b{display:inline-block;font-weight:inherit;transform:translateY(105%);transition:transform .9s var(--ease);transition-delay:var(--d)}
.in .w1>b{transform:none}
.marq{overflow:hidden;border-block:1px solid #0001;padding:calc(74px + env(safe-area-inset-top,0px)) 0 18px;direction:ltr}
.marq div{display:flex;gap:60px;width:max-content;animation:mq 30s linear infinite;font:800 22px Syne;letter-spacing:.2em;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
/* collections */
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:60px}
.col{position:relative;border-radius:28px;overflow:hidden;background:#d9d9d6;min-height:340px;display:flex;align-items:flex-end;color:#fff;transition:transform .6s var(--ease)}
.col:nth-child(1){grid-column:span 7;min-height:520px}.col:nth-child(2){grid-column:span 5;margin-top:70px}
.col:nth-child(3){grid-column:span 4}.col:nth-child(4){grid-column:span 4;margin-top:50px}.col:nth-child(5){grid-column:span 4}
.col .art{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.col:hover .art{transform:scale(1.07)}.col:hover{transform:translateY(-8px)}
.col .t{position:relative;padding:26px;width:100%;background:linear-gradient(transparent,#000a)}
.col h3{font-size:clamp(28px,4vw,52px);font-weight:900;line-height:1.2}
.col small{opacity:.8;display:block}
@media(max-width:800px){.cols{grid-template-columns:1fr}.col,.col:nth-child(n){grid-column:auto;margin-top:0;min-height:300px}}
.reveal-img{clip-path:inset(0 0 100% 0);transition:clip-path 1.3s var(--ease)}.in .reveal-img,.reveal-img.in{clip-path:inset(0)}
/* shop */
.bar{display:flex;gap:12px;flex-wrap:wrap;margin:40px 0 30px;align-items:center}
.bar input,.bar select{background:#fff;border:1px solid #0002;border-radius:30px;padding:12px 20px;font:inherit;min-width:0}
.bar input{flex:1 1 220px}
.chip{padding:10px 20px;border-radius:30px;border:1px solid #0003;transition:.3s}.chip[aria-pressed=true],.chip:hover{background:#0a0a0a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 20px}
.card{transition:opacity .5s,transform .8s var(--ease)}
.card .art{aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--g1);position:relative;cursor:pointer}
.card .art svg{transition:transform .9s var(--ease)}.card:hover .art svg{transform:scale(1.07)}
.card .art .b2{position:absolute;inset:0;opacity:0;transition:opacity .5s;background:var(--g1)}.card:hover .b2,.card.tap .b2{opacity:1}
.card h3{font-size:17px;margin-top:14px;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font:800 17px/1.35 Syne,sans-serif;direction:ltr;display:inline-block;white-space:nowrap;letter-spacing:.025em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sw{display:flex;gap:8px;margin:8px 0}
.sw button,.sw span{width:22px;height:22px;border-radius:50%;background:var(--c);border:1px solid #0004;transition:.3s var(--ease)}
.sw [aria-pressed=true]{outline:2px solid #0a0a0a;outline-offset:3px;transform:scale(1.1)}
.sz{display:flex;gap:8px;flex-wrap:wrap}
.sz button{min-width:44px;height:44px;border:1px solid #0004;border-radius:14px;font:700 13px Syne;transition:.3s var(--ease)}.sz button:hover{border-color:#000}.sz button[aria-pressed=true]{background:#0a0a0a;color:#fff}
.mini{margin-top:10px;width:100%;justify-content:center;padding:12px}
.empty{padding:60px 0;text-align:center;color:var(--g2);font-size:20px}
/* dark */
.dark{background:#0a0a0a;color:#fff}
.show{overflow:hidden}
.show .frame{border-radius:28px;overflow:hidden;clip-path:inset(18% 22% round 28px);will-change:clip-path;aspect-ratio:16/9;background:#222;margin-top:50px}
@media(max-width:700px){.show .frame{aspect-ratio:4/5}}
/* modal / drawer */
.ov{position:fixed;inset:0;z-index:80;background:#0008;opacity:0;pointer-events:none;transition:.5s}.ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:#fff;z-index:90;transform:translateX(var(--o));transition:transform .7s var(--ease);display:flex;flex-direction:column;padding:24px}
[dir=rtl] .drawer{--o:-105%;inset-inline-end:auto;left:0}[dir=ltr] .drawer{--o:105%;right:0}
.drawer.open{transform:none}
.items{flex:1;overflow:auto;margin:20px 0}
.it{display:grid;grid-template-columns:80px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid #0001;align-items:center}
.it .art{width:80px;height:100px;border-radius:12px;overflow:hidden;background:var(--g1)}
.qty{display:inline-flex;align-items:center;border:1px solid #0003;border-radius:30px}.qty button{width:36px;height:36px;font-size:18px}.qty span{min-width:24px;text-align:center;font-family:Syne}
.x{width:40px;height:40px;border-radius:50%;background:var(--g1);font-size:20px}
.pd{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .8s var(--ease);visibility:hidden;padding:90px 0 60px}
.pd.open{transform:none;visibility:visible}
.pdg{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,4vw,60px)}
.pdg .main{aspect-ratio:4/5;border-radius:26px;overflow:hidden;background:var(--g1)}
.thumbs{display:flex;gap:10px;margin-top:10px}.thumbs button{width:72px;height:90px;border-radius:12px;overflow:hidden;opacity:.5;transition:.3s;background:var(--g1)}.thumbs [aria-pressed=true]{opacity:1;outline:2px solid #000;outline-offset:2px}
.pdg h2{font-size:clamp(32px,5vw,64px);font-weight:900;line-height:1.2}
.pdg h4{margin:22px 0 8px;font-size:14px;color:var(--g2)}
@media(max-width:800px){.pdg{grid-template-columns:1fr}}
.fade{animation:fd .5s var(--ease)}@keyframes fd{from{opacity:0;transform:scale(1.03)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 30px;background:#0a0a0a;color:#fff;padding:14px 26px;border-radius:30px;z-index:120;opacity:0;transition:.5s var(--ease);pointer-events:none}.toast.on{opacity:1;translate:-50% 0}
footer{padding:80px 0 30px}
footer .fg{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px}
footer h5{font-size:13px;color:#999;margin-bottom:12px}footer li{list-style:none;margin:6px 0}footer ul{padding:0}
.nl{display:flex;gap:8px;margin-top:16px}.nl input{flex:1;min-width:0;border-radius:30px;border:1px solid #fff4;background:none;color:#fff;padding:12px 18px;font:inherit}
@media(max-width:800px){footer .fg{grid-template-columns:1fr 1fr}footer .fg>:first-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0s!important}html{scroll-behavior:auto}}
/* ===== admin + checkout ===== */
#yr{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.ovl{position:fixed;inset:0;z-index:200;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}.ovl.on{display:flex}
.mdl{background:#fff;border-radius:24px;padding:26px;width:min(560px,100%);max-height:92svh;overflow:auto}.mdl h3{font-weight:900;font-size:24px;margin-bottom:14px}
/* Full-screen checkout: independent scroll area, isolated from the page */
#mo.checkout-full{padding:0;align-items:stretch;justify-content:stretch;overflow:hidden;overscroll-behavior:contain;touch-action:pan-y}
#mo.checkout-full .mdl{width:100%;max-width:none;height:100%;max-height:100dvh;min-height:100%;border-radius:0;padding:calc(22px + env(safe-area-inset-top,0px)) clamp(18px,5vw,64px) calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mo.checkout-full #cf{max-width:900px;margin:0 auto}#mo.checkout-full h3{max-width:900px;margin:0 auto 22px;font-size:clamp(25px,4vw,36px)}
#mo.checkout-full .fld,#mo.checkout-full .pay,#mo.checkout-full .shot,#mo.checkout-full .row{touch-action:pan-y}
/* Promo code checkout UI */
.promo-box{margin:18px 0;padding:16px;border:1px solid #e5e5e2;border-radius:18px;background:#fafaf9;direction:ltr;text-align:left}
.promo-title{display:block;font:700 14px/1.3 Syne,sans-serif;letter-spacing:.01em;color:#171717;margin-bottom:10px}
.promo-line{display:flex;gap:8px;align-items:stretch}
.promo-line input{flex:1;min-width:0;border:1px solid #d7d7d2;border-radius:12px;padding:12px 14px;background:#fff;color:#111;font:600 14px Syne,sans-serif;letter-spacing:.04em;text-transform:uppercase;outline:none}
.promo-line input:focus{border-color:#111;box-shadow:0 0 0 3px #0000000c}
.promo-apply{border:0;border-radius:12px;background:#111;color:#fff;padding:0 22px;font:700 12px Syne,sans-serif;letter-spacing:.1em;cursor:pointer;transition:.2s}
.promo-apply:disabled{opacity:.5;cursor:default}
.promo-feedback{font:600 12px Syne,sans-serif;min-height:17px;margin-top:8px;color:#b3261e}
.promo-feedback.good{color:#168447}
.promo-applied{font:700 12px Syne,sans-serif;color:#168447;margin-top:8px}
.promo-success{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;background:#00000033;backdrop-filter:none;-webkit-backdrop-filter:none;animation:promoFade .12s ease}
.promo-success-card{width:min(360px,100%);background:#fff;color:#111;border-radius:24px;padding:30px 24px;text-align:center;box-shadow:0 24px 80px #0004;animation:promoPop .35s cubic-bezier(.2,.8,.2,1)}
.promo-check{width:66px;height:66px;border-radius:50%;margin:0 auto 16px;background:#e7f7ed;color:#159447;display:grid;place-items:center;animation:promoCheck .45s .1s both}
.promo-check svg{width:34px;height:34px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.promo-success-card h4{font:800 19px Syne,sans-serif;margin:0 0 7px}.promo-success-card p{font:600 13px Syne,sans-serif;color:#555;margin:0}
@keyframes promoFade{from{opacity:0}}@keyframes promoPop{from{opacity:0;transform:translateY(12px) scale(.94)}}@keyframes promoCheck{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.price-sale{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;direction:ltr}.price-sale .now{font:800 17px/1.35 Syne,sans-serif;letter-spacing:.025em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}.price-sale .was{font:700 12px/1.35 Syne,sans-serif;letter-spacing:.015em;font-variant-numeric:tabular-nums;color:#92928d;text-decoration:line-through}.price-sale .pct{font:800 11px Syne,sans-serif;color:#159447;background:#e5f7eb;border-radius:20px;padding:3px 8px;white-space:nowrap}.price-sale.large .now{font-size:26px}
@media(max-width:600px){#mo.checkout-full .mdl{padding-inline:16px}.price-sale{gap:6px}}
.fld{display:block;margin:10px 0;font-size:13px;color:var(--g2)}.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;background:#f4f4f2;border:1px solid #0002;border-radius:14px;padding:11px 14px;font:inherit;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.err{color:#b3261e;font-size:13px;min-height:18px}
.pay{background:#f4f4f2;border-radius:16px;padding:14px;font-size:14px;margin:10px 0;white-space:pre-line}.shot{border:2px dashed #0004;border-radius:16px;padding:16px;text-align:center;cursor:pointer;display:block}.shot img{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
/* ===== payment methods (checkout) ===== */
.pm-t{display:block;font-weight:800;font-size:15px;margin:16px 0 0;color:var(--ink)}
.pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.pm-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:12px;border:1.5px solid #0002;border-radius:20px;background:#fff;color:#0a0a0a;text-align:center;transition:transform .3s var(--ease),border-color .3s,background .3s,box-shadow .3s}
.pm-card:hover:not(:disabled){transform:translateY(-2px);border-color:#0a0a0a}
.pm-card[aria-pressed=true]{background:#0a0a0a;border-color:#0a0a0a;color:#fff;box-shadow:0 10px 28px #0003}
.pm-card[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;inset-inline-end:10px;width:20px;height:20px;border-radius:50%;background:#fff;color:#0a0a0a;font:800 12px/20px Syne,sans-serif}
.pm-card:disabled{opacity:.5;cursor:not-allowed}
.pm-lg{display:grid;place-items:center;width:100%;height:46px;border-radius:12px;background:#fff;padding:6px 10px;overflow:hidden}
.pm-lg{height:46px}.pm-lg img{width:auto;height:32px;max-width:100%;object-fit:contain;display:block}.pm-card[data-pm=vodafone] .pm-lg img{height:36px;width:36px;border-radius:9px}.pm-card[data-pm=meeza] .pm-lg img{height:36px}
.pm-wm{font:800 15px Syne,sans-serif;letter-spacing:.04em;color:#0a0a0a;direction:ltr}
.pm-un{font-size:11px;opacity:.85;line-height:1.3}
.pm-pw{grid-column:1/-1;animation:fd .45s var(--ease)}
.pm-panel{border:1px solid #0002;border-radius:20px;padding:18px;background:#fafaf9}
.pm-pt{font-weight:800;font-size:14px;color:var(--g2);margin-bottom:8px}
.pm-num{font:800 clamp(18px,5.4vw,26px)/1.4 Syne,sans-serif;direction:ltr;text-align:center;letter-spacing:.06em;word-break:break-all;background:#fff;border:1px dashed #0004;border-radius:14px;padding:14px 10px;margin:6px 0 10px;user-select:all;-webkit-user-select:all}
.pm-hold{font-size:13px;color:#444;text-align:center;margin-bottom:10px}
.pm-cp{width:100%;justify-content:center;padding:13px 20px;margin-top:2px}
.pm-cp.done{background:#168447}
.pm-tt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:#0a0a0a;color:#fff;font-weight:700}
.pm-tt b{font:800 18px Syne,sans-serif;direction:ltr;white-space:nowrap}
.pm-st{margin:12px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.9;color:#333}
.pm-wn{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#fff7e0;color:#7a5a00;font-size:13px;line-height:1.7}
.pm-ex{margin:10px 0 0;font-size:13px;color:#444;white-space:pre-line}
/* ===== VESTRA admin v2 (dark) ===== */
#yr{touch-action:manipulation;cursor:default}
img{max-width:100%}
.card .art img{transition:transform .9s var(--ease)}.card:hover .art img{transform:scale(1.07)}
#ftBanner{height:clamp(140px,22vw,260px);border-radius:24px;overflow:hidden;margin-bottom:50px;background:#1b1b1b}
/* password modal */
.pwo{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:pwf .3s ease}
@keyframes pwf{from{opacity:0}}
.pwc{position:relative;width:min(400px,100%);background:#111113;color:#f3f3f1;border:1px solid #2a2a2e;border-radius:26px;padding:34px 28px 28px;text-align:center;box-shadow:0 30px 80px #000c;animation:pwu .45s var(--ease)}
@keyframes pwu{from{opacity:0;transform:translateY(24px) scale(.96)}}
.pwc.sh{animation:pws .45s}@keyframes pws{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pwx{position:absolute;top:14px;inset-inline-end:16px;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;color:#999}.pwx:hover{background:#ffffff14;color:#fff}
.pwl{width:58px;height:58px;border-radius:18px;background:#1c1c20;border:1px solid #2e2e33;display:grid;place-items:center;margin:0 auto 14px}
.pwl svg{width:26px;height:26px;stroke:#e7dccb}

.pwc p.sub{color:#8e8e94;font-size:13.5px;margin-bottom:20px}
.pwi{position:relative}.pwi input{width:100%;background:#0a0a0b;border:1px solid #2e2e33;border-radius:14px;padding:14px 16px;padding-inline-end:50px;color:#fff;font:inherit;font-size:15px;outline:0;transition:.25s}
.pwi input:focus{border-color:#e7dccb;box-shadow:0 0 0 3px #e7dccb22}
.pwi button{position:absolute;top:50%;translate:0 -50%;inset-inline-end:8px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#999}.pwi button:hover{background:#ffffff12;color:#fff}.pwi svg{width:20px;height:20px}
.pwe{min-height:22px;margin:10px 0 6px;font-size:13px;color:#ff7b7b;opacity:0;transform:translateY(-4px);transition:.3s}.pwe.on{opacity:1;transform:none}
.pwb{width:100%;padding:14px;border-radius:14px;background:#e7dccb;color:#17130d;font-weight:800;font-size:15px;transition:.25s}.pwb:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}.pwb:disabled{opacity:.5;cursor:not-allowed}
/* ---- login: loading + success animation ---- */
.pwc.busy .pwb{opacity:.9;cursor:progress}
.pwc.busy input{opacity:.6}
.pwsp{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #17130d44;border-top-color:#17130d;animation:pwrot .7s linear infinite;vertical-align:-3px;margin-inline-end:8px}
@keyframes pwrot{to{transform:rotate(360deg)}}
.pwld{height:3px;border-radius:3px;background:#ffffff10;overflow:hidden;margin:12px 2px 0;opacity:0;transition:opacity .3s}
.pwc.busy .pwld{opacity:1}
.pwld i{display:block;height:100%;width:38%;border-radius:3px;background:linear-gradient(90deg,transparent,#e7dccb,transparent);animation:pwsl 1s linear infinite}
@keyframes pwsl{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
.pwo.out{opacity:0;transition:opacity .35s ease}
.pwc.ok{padding:46px 28px 40px}
.pwok{display:flex;flex-direction:column;align-items:center;gap:20px}
.pwck{width:104px;height:104px;overflow:visible;animation:pwpop .55s 1.15s ease}
.pwck-bg{fill:#34d27b1c;opacity:0;animation:pwfd .5s .55s forwards}
.pwck-c{fill:none;stroke:#34d27b;stroke-width:3;stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:226;transform:rotate(-90deg);transform-origin:center;animation:pwdr .75s .1s cubic-bezier(.65,0,.35,1) forwards}
.pwck-p{fill:none;stroke:#34d27b;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:52;stroke-dashoffset:52;animation:pwdr .45s .75s ease-out forwards}
.pwwel{font:600 24px Syne,Alexandria,sans-serif;letter-spacing:.02em;direction:ltr;opacity:0;transform:translateY(16px);animation:pwup .65s 1.1s var(--ease) forwards}
.pwwel span{color:#8e8e94;font-weight:500}.pwwel b{color:#e7dccb;font-weight:800}
.pwbar{width:150px;height:3px;border-radius:3px;background:#ffffff14;overflow:hidden;opacity:0;animation:pwfd .3s 1.5s forwards}
.pwbar i{display:block;height:100%;background:#e7dccb;transform:scaleX(0);transform-origin:center;animation:pwbr .9s 1.5s ease-in-out forwards}
@keyframes pwdr{to{stroke-dashoffset:0}}
@keyframes pwfd{to{opacity:1}}
@keyframes pwup{to{opacity:1;transform:none}}
@keyframes pwbr{to{transform:scaleX(1)}}
@keyframes pwpop{50%{transform:scale(1.1)}}

.adx-w>*{animation:adxUp .62s var(--ease) both}
.adx-w>*:nth-child(1){animation-delay:.10s}.adx-w>*:nth-child(2){animation-delay:.16s}.adx-w>*:nth-child(3){animation-delay:.22s}.adx-w>*:nth-child(4){animation-delay:.28s}.adx-w>*:nth-child(5){animation-delay:.34s}.adx-w>*:nth-child(6){animation-delay:.4s}.adx-w>*:nth-child(7){animation-delay:.46s}
.adx-ov.adx-out{animation:adxOut .26s ease both}.adx-ov.adx-out .adx-card{animation:adxCardOut .26s ease both}

@keyframes adxOut{to{opacity:0}}
@keyframes adxCard{from{opacity:0;transform:translateY(26px) scale(.95)}}

/* ===== VESTRA checkout entrance motion ===== */
#mo.checkout-full.on{
  animation:vestraCheckoutBackdrop .42s ease-out both;
  background:rgba(5,5,5,.78);
  -webkit-backdrop-filter:blur(7px);
  backdrop-filter:blur(7px);
}
#mo.checkout-full .mdl{
  animation:vestraCheckoutPage .78s cubic-bezier(.16,1,.3,1) both;
  transform-origin:50% 100%;
}
#mo.checkout-full h3{
  animation:vestraCheckoutHeading .65s .12s cubic-bezier(.16,1,.3,1) both;
}
#mo.checkout-full #cf > *{
  animation:vestraCheckoutField .58s cubic-bezier(.16,1,.3,1) both;
}
#mo.checkout-full #cf > *:nth-child(1){animation-delay:.16s}
#mo.checkout-full #cf > *:nth-child(2){animation-delay:.21s}
#mo.checkout-full #cf > *:nth-child(3){animation-delay:.26s}
#mo.checkout-full #cf > *:nth-child(4){animation-delay:.31s}
#mo.checkout-full #cf > *:nth-child(5){animation-delay:.36s}
#mo.checkout-full #cf > *:nth-child(6){animation-delay:.41s}
#mo.checkout-full #cf > *:nth-child(7){animation-delay:.46s}
#mo.checkout-full #cf > *:nth-child(8){animation-delay:.51s}
#mo.checkout-full #cf > *:nth-child(9){animation-delay:.56s}
@keyframes vestraCheckoutBackdrop{from{opacity:0}to{opacity:1}}
@keyframes vestraCheckoutPage{
  0%{opacity:0;transform:translateY(48px) scale(.985)}
  65%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes vestraCheckoutHeading{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes vestraCheckoutField{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  #mo.checkout-full.on,#mo.checkout-full .mdl,#mo.checkout-full h3,#mo.checkout-full #cf>*{
    animation:none!important;transform:none!important;opacity:1!important
  }
}

.promo-check{width:68px;height:68px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(145deg,#e9f8ee,#d8efdf);color:#21834b;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(33,131,75,.07);animation:promoCheckIn .5s .08s cubic-bezier(.16,1,.3,1) both}

.promo-success-card h4{font:800 20px Syne,sans-serif;margin:0 0 8px;letter-spacing:-.02em}

@keyframes promoOverlayIn{from{opacity:0}}@keyframes promoCardIn{from{opacity:0;transform:translateY(15px) scale(.94)}}@keyframes promoCheckIn{from{opacity:0;transform:scale(.45) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes promoDrawCheck{to{stroke-dashoffset:0}}@keyframes promoAppliedIn{from{opacity:0;transform:translateY(5px)}}@keyframes promoButtonTick{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
